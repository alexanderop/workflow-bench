<svg class="wb-controlled-comparison" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 535" role="img" aria-labelledby="wb-controlled-comparison-title wb-controlled-comparison-desc"><title id="wb-controlled-comparison-title">Change only the workflow</title><desc id="wb-controlled-comparison-desc">Hold the task, model, tools and limits fixed. Compare plain Codex with Codex plus a workflow. Independently grade each patch with the same rules. Compare paired outcomes across independent tasks and repetitions. Child usage that is not observed stays unknown.</desc><style>
svg.wb-controlled-comparison { --paper:#14110f; --ink:#f3dcc3; --muted:#c6a98b; --line:#ba8960; --accent:#ff982f; background:var(--diagram-paper,var(--paper)); }
@media(prefers-color-scheme:light){svg.wb-controlled-comparison{--paper:#faf4e8;--ink:#38281c;--muted:#71543c;--line:#946b46;--accent:#af4a08;}}
svg.wb-controlled-comparison text{font-family:ui-sans-serif,system-ui,sans-serif;fill:var(--diagram-ink,var(--ink));font-size:19px;}
svg.wb-controlled-comparison .box{fill:none;stroke:var(--diagram-line,var(--line));stroke-width:2;stroke-linejoin:round;}
svg.wb-controlled-comparison .arrow{fill:none;stroke:var(--diagram-accent,var(--accent));stroke-width:2.5;marker-end:url(#wb-controlled-comparison-arrow);}
svg.wb-controlled-comparison .label{font-size:15px;fill:var(--diagram-muted,var(--muted));}svg.wb-controlled-comparison .accent{fill:var(--diagram-accent,var(--accent));font-weight:650;}
</style><defs><marker id="wb-controlled-comparison-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--diagram-accent,var(--accent))" stroke-width="1.5"/></marker></defs><text class="accent" x="40" y="42">HOLD THE CONDITIONS FIXED.</text><path class="box" d="M175 67 L627 65 L630 142 L171 145 Z"/><text x="400.0" y="97" text-anchor="middle">Same task · model · tools · limits</text><text class="label" x="400.0" y="123" text-anchor="middle">equal access to delegation</text><path class="arrow" d="M280 150 L210 199"/><path class="arrow" d="M520 150 L590 199"/><path class="box" d="M65 210 L357 208 L360 285 L61 288 Z"/><text x="210.0" y="240" text-anchor="middle">Plain Codex</text><text class="label" x="210.0" y="266" text-anchor="middle">no extra workflow</text><path class="box" d="M445 210 L737 208 L740 285 L441 288 Z"/><text x="590.0" y="240" text-anchor="middle">Codex + workflow</text><text class="label" x="590.0" y="266" text-anchor="middle">the selected treatment</text><path class="arrow" d="M210 293 L210 338"/><path class="arrow" d="M590 293 L590 338"/><path class="box" d="M65 350 L357 348 L360 425 L61 428 Z"/><text x="210.0" y="380" text-anchor="middle">Independent grade</text><text class="label" x="210.0" y="406" text-anchor="middle">same acceptance rules</text><path class="box" d="M445 350 L737 348 L740 425 L441 428 Z"/><text x="590.0" y="380" text-anchor="middle">Independent grade</text><text class="label" x="590.0" y="406" text-anchor="middle">same acceptance rules</text><text class="label" x="400" y="472" text-anchor="middle">Compare paired outcomes across tasks and repetitions.</text><text class="label" x="400" y="502" text-anchor="middle">Unknown child usage stays unknown.</text></svg>
