<svg class="wb-qualification" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="wb-qualification-title wb-qualification-desc"><title id="wb-qualification-title">Qualify before solving</title><desc id="wb-qualification-desc">Required gates: the broken base must fail the intended regression and unrelated checks must pass. The reference must pass all checks. No checks may time out. A separate mutation proof should reject an incomplete fix. These are expected conditions, not measured workflow results.</desc><style>
svg.wb-qualification { --paper:#14110f; --ink:#f3dcc3; --muted:#c6a98b; --line:#ba8960; --accent:#ff982f; background:var(--diagram-paper,var(--paper)); }
@media(prefers-color-scheme:light){svg.wb-qualification{--paper:#faf4e8;--ink:#38281c;--muted:#71543c;--line:#946b46;--accent:#af4a08;}}
svg.wb-qualification text{font-family:ui-sans-serif,system-ui,sans-serif;fill:var(--diagram-ink,var(--ink));font-size:19px;}
svg.wb-qualification .box{fill:none;stroke:var(--diagram-line,var(--line));stroke-width:2;stroke-linejoin:round;}
svg.wb-qualification .arrow{fill:none;stroke:var(--diagram-accent,var(--accent));stroke-width:2.5;marker-end:url(#wb-qualification-arrow);}
svg.wb-qualification .label{font-size:15px;fill:var(--diagram-muted,var(--muted));}svg.wb-qualification .accent{fill:var(--diagram-accent,var(--accent));font-weight:650;}
</style><defs><marker id="wb-qualification-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--diagram-accent,var(--accent))" stroke-width="1.5"/></marker></defs><text class="accent" x="40" y="42">CHECK THE GRADER BEFORE THE AGENT.</text><path class="box" d="M45 80 L367 78 L370 160 L41 163 Z"/><text x="205.0" y="110" text-anchor="middle">Broken base</text><text class="label" x="205.0" y="136" text-anchor="middle">intended regression fails</text><path class="box" d="M435 80 L757 78 L760 160 L431 163 Z"/><text x="595.0" y="110" text-anchor="middle">Trusted reference</text><text class="label" x="595.0" y="136" text-anchor="middle">all checks pass</text><path class="arrow" d="M205 168 L330 226"/><path class="arrow" d="M595 168 L470 226"/><path class="box" d="M235 237 L567 235 L570 317 L231 320 Z"/><text x="400.0" y="267" text-anchor="middle">Required qualification gate</text><text class="label" x="400.0" y="293" text-anchor="middle">unrelated checks pass · no timeout</text><path class="box" d="M235 367 L567 365 L570 442 L231 445 Z"/><text x="400.0" y="397" text-anchor="middle">Separate mutation proof</text><text class="label" x="400.0" y="423" text-anchor="middle">reject a plausible incomplete fix</text><path class="box" stroke-dasharray="6 7" d="M400 325 L400 360"/><text class="label" x="400" y="485" text-anchor="middle">Expected conditions, not workflow scores.</text></svg>
