<svg class="wb-solver-grader" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="wb-solver-grader-title wb-solver-grader-desc"><title id="wb-solver-grader-title">The patch crosses the boundary</title><desc id="wb-solver-grader-desc">A qualified baseline image starts a solver and an independent grader. The solver exports a production patch. Trusted tests enter only the grader. The grader has no network or credentials.</desc><style>
svg.wb-solver-grader { --paper:#14110f; --ink:#f3dcc3; --muted:#c6a98b; --line:#ba8960; --accent:#ff982f; background:var(--diagram-paper,var(--paper)); }
@media(prefers-color-scheme:light){svg.wb-solver-grader{--paper:#faf4e8;--ink:#38281c;--muted:#71543c;--line:#946b46;--accent:#af4a08;}}
svg.wb-solver-grader text{font-family:ui-sans-serif,system-ui,sans-serif;fill:var(--diagram-ink,var(--ink));font-size:19px;}
svg.wb-solver-grader .box{fill:none;stroke:var(--diagram-line,var(--line));stroke-width:2;stroke-linejoin:round;}
svg.wb-solver-grader .arrow{fill:none;stroke:var(--diagram-accent,var(--accent));stroke-width:2.5;marker-end:url(#wb-solver-grader-arrow);}
svg.wb-solver-grader .label{font-size:15px;fill:var(--diagram-muted,var(--muted));}svg.wb-solver-grader .accent{fill:var(--diagram-accent,var(--accent));font-weight:650;}
</style><defs><marker id="wb-solver-grader-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--diagram-accent,var(--accent))" stroke-width="1.5"/></marker></defs><text class="accent" x="40" y="42">ONE BASELINE. TWO SEPARATE CONTAINERS.</text><path class="box" d="M275 72 L527 70 L530 147 L271 150 Z"/><text x="400.0" y="102" text-anchor="middle">Qualified image</text><text class="label" x="400.0" y="128" text-anchor="middle">same immutable identity</text><path class="arrow" d="M310 153 L170 205"/><path class="arrow" d="M490 153 L630 205"/><path class="box" d="M45 212 L297 210 L300 292 L41 295 Z"/><text x="170.0" y="242" text-anchor="middle">Solver</text><text class="label" x="170.0" y="268" text-anchor="middle">task + workflow + credentials</text><path class="box" d="M505 212 L757 210 L760 292 L501 295 Z"/><text x="630.0" y="242" text-anchor="middle">Independent grader</text><text class="label" x="630.0" y="268" text-anchor="middle">offline · no credentials</text><path class="arrow" d="M304 250 L492 250"/><text class="label" x="400" y="235" text-anchor="middle">candidate.patch</text><path class="box" d="M515 342 L747 340 L750 412 L511 415 Z"/><text x="630.0" y="372" text-anchor="middle">Trusted tests</text><text class="label" x="630.0" y="398" text-anchor="middle">never solver-visible</text><path class="arrow" d="M630 338 L630 300"/><text class="label" x="40" y="356">The solver edits production code.</text><text class="label" x="40" y="382">The grader applies only the patch.</text></svg>
